<div class="dialog-container">
  <h2 mat-dialog-title>Assign Modules to {{ data.username }}</h2>

  <mat-dialog-content>
    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="30"></mat-spinner>
      <p>Loading modules...</p>
    </div>

    <div *ngIf="!isLoading && modules.length === 0" class="empty-state">
      <p>No modules available in this project.</p>
    </div>

    <mat-selection-list *ngIf="!isLoading && modules.length > 0">
      <mat-list-option
        *ngFor="let module of modules"
        [selected]="isModuleSelected(module.id)"
        (click)="toggleModule(module.id)">
        {{ module.name }}
      </mat-list-option>
    </mat-selection-list>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" [disabled]="isSaving">
      Cancel
    </button>
    <button mat-flat-button color="primary" (click)="onSave()" [disabled]="isSaving">
      {{ isSaving ? 'Saving...' : 'Save Changes' }}
    </button>
  </mat-dialog-actions>
</div>
